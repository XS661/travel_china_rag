<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#070b14">
    <meta name="description" content="走遍中国 · 智能旅游助手 — 覆盖 8 个热门旅游城市，景点 / 美食 / 交通 / 行程一站式问答">
    <title>走遍中国 · 智能旅游助手</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        /* ============================================================
           走遍中国 · 智能旅游助手 — 深色极光玻璃拟态主题
           移动优先（414px），PC 端居中成手机形态
           ============================================================ */
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-0: #05070d;
            --bg-1: #0a101d;
            --bg-2: #0f1830;
            --text: #eef2f8;
            --dim: #9aa7bd;
            --faint: #5f6d85;
            --gold: #f7b84a;
            --gold-2: #ffd37a;
            --amber: #ff9d5c;
            --cyan: #3fd9ff;
            --violet: #8b7cf6;
            --teal: #2dd4bf;
            --rose: #fb7185;
            --ok: #34d399;
            --warn: #fbbf24;
            --err: #f87171;
            --glass: linear-gradient(180deg, rgba(255, 255, 255, 0.07), rgba(255, 255, 255, 0.03));
            --stroke: rgba(255, 255, 255, 0.09);
            --stroke-strong: rgba(255, 255, 255, 0.18);
            --shadow-1: 0 12px 34px rgba(2, 6, 18, 0.55);
            --r-lg: 22px;
            --r-md: 15px;
            --r-sm: 11px;
            --font-ui: 'Outfit', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            --font-display: 'Noto Serif SC', 'Songti SC', 'STSong', 'SimSun', serif;
        }

        [hidden] { display: none !important; }

        html, body { height: 100%; }

        body {
            font-family: var(--font-ui);
            color: var(--text);
            background: var(--bg-0);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
            text-rendering: optimizeLegibility;
        }

        ::selection { background: rgba(247, 184, 74, 0.35); color: #fff; }

        button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }

        /* ============================================================
           背景装饰：极光光斑 + 胶片噪点
           ============================================================ */
        .bg {
            position: fixed; inset: 0; z-index: 0;
            overflow: hidden;
            background:
                radial-gradient(130% 95% at 12% -5%, #111d3a 0%, rgba(7, 11, 20, 0) 55%),
                radial-gradient(90% 70% at 100% 100%, #0d1230 0%, rgba(5, 7, 13, 0) 60%),
                linear-gradient(160deg, #0a1120 0%, #060a14 55%, #05070d 100%);
        }

        .blob {
            position: absolute;
            border-radius: 50%;
            filter: blur(70px);
            opacity: 0.55;
            will-change: transform;
            pointer-events: none;
        }
        .blob-1 {
            width: 56vmax; height: 56vmax; left: -20vmax; top: -18vmax;
            background: radial-gradient(circle at 32% 32%, rgba(52, 86, 160, 0.85), transparent 62%);
            animation: drift1 24s ease-in-out infinite alternate;
        }
        .blob-2 {
            width: 44vmax; height: 44vmax; right: -16vmax; top: 22%;
            background: radial-gradient(circle at 60% 40%, rgba(18, 96, 116, 0.8), transparent 62%);
            animation: drift2 28s ease-in-out infinite alternate;
        }
        .blob-3 {
            width: 42vmax; height: 42vmax; left: 16%; bottom: -20vmax;
            background: radial-gradient(circle at 50% 50%, rgba(84, 54, 140, 0.75), transparent 62%);
            animation: drift3 32s ease-in-out infinite alternate;
        }
        .grain {
            position: absolute; inset: 0; opacity: 0.05; pointer-events: none;
            background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='0.55'/></svg>");
        }

        @keyframes drift1 {
            from { transform: translate3d(0, 0, 0) scale(1); }
            to   { transform: translate3d(7vmax, 5vmax, 0) scale(1.14); }
        }
        @keyframes drift2 {
            from { transform: translate3d(0, 0, 0) scale(1.05); }
            to   { transform: translate3d(-6vmax, -4vmax, 0) scale(0.94); }
        }
        @keyframes drift3 {
            from { transform: translate3d(0, 0, 0); }
            to   { transform: translate3d(5vmax, -6vmax, 0); }
        }

        /* ============================================================
           App 外壳
           ============================================================ */
        .app-shell {
            position: relative; z-index: 1;
            width: 100%; max-width: 440px;
            height: 100vh;
            height: 100dvh;
            display: flex; flex-direction: column;
            overflow: hidden;
            background: linear-gradient(180deg, rgba(16, 24, 44, 0.5) 0%, rgba(8, 12, 22, 0.72) 100%);
            backdrop-filter: blur(26px) saturate(1.25);
            -webkit-backdrop-filter: blur(26px) saturate(1.25);
            box-shadow: 0 30px 90px rgba(0, 0, 0, 0.65);
        }

        /* ============================================================
           顶栏
           ============================================================ */
        .topbar {
            flex: none;
            display: flex; align-items: center; justify-content: space-between;
            gap: 10px;
            padding: calc(14px + env(safe-area-inset-top)) 14px 12px;
            border-bottom: 1px solid var(--stroke);
            background: rgba(10, 16, 29, 0.35);
        }

        .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }

        .brand-mark {
            flex: none;
            width: 42px; height: 42px;
            border-radius: 13px;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, var(--gold-2), var(--gold) 55%, var(--amber) 100%);
            box-shadow: 0 8px 20px rgba(247, 184, 74, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.4);
        }
        .brand-mark svg { width: 24px; height: 24px; }

        .brand-text { min-width: 0; }
        .brand-text h1 {
            font-family: var(--font-display);
            font-size: 16.5px; font-weight: 900;
            letter-spacing: 2.5px;
            white-space: nowrap;
        }
        .brand-text p {
            font-size: 10px; color: var(--dim);
            letter-spacing: 3px; margin-top: 1px;
        }

        .topbar-actions { display: flex; align-items: center; gap: 7px; flex: none; }

        .status-pill {
            display: flex; align-items: center; gap: 6px;
            padding: 5px 10px;
            border-radius: 999px;
            border: 1px solid var(--stroke);
            background: rgba(255, 255, 255, 0.04);
            font-size: 11px; color: var(--dim);
            transition: border-color 0.25s;
        }
        .status-pill .dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--faint);
            transition: background 0.25s, box-shadow 0.25s;
        }
        .status-pill.online .dot { background: var(--ok); box-shadow: 0 0 9px var(--ok); animation: pulse 2.2s ease-in-out infinite; }
        .status-pill.online { color: var(--ok); }
        .status-pill.offline .dot { background: var(--err); box-shadow: 0 0 9px var(--err); }
        .status-pill.offline { color: var(--err); }

        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.35; } }

        .icon-btn {
            width: 34px; height: 34px;
            border-radius: 11px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid var(--stroke);
            color: var(--dim);
            cursor: pointer;
            transition: all 0.2s;
        }
        .icon-btn:hover { color: var(--text); border-color: var(--stroke-strong); background: rgba(255, 255, 255, 0.09); }
        .icon-btn:active { transform: scale(0.92); }
        .icon-btn svg { width: 16px; height: 16px; }

        /* ============================================================
           聊天滚动区
           ============================================================ */
        .chat-scroll {
            flex: 1;
            overflow-y: auto;
            overscroll-behavior: contain;
            padding: 18px 15px 12px;
        }
        .chat-scroll::-webkit-scrollbar { width: 6px; }
        .chat-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.12); border-radius: 6px; }
        .chat-scroll::-webkit-scrollbar-thumb:hover { background: rgba(255, 255, 255, 0.2); }

        /* ============================================================
           欢迎页
           ============================================================ */
        .welcome { text-align: center; padding: 42px 12px 24px; animation: fadeUp 0.6s cubic-bezier(0.22, 0.9, 0.32, 1) both; }

        .welcome-mark {
            position: relative;
            width: 92px; height: 92px;
            margin: 0 auto 18px;
            display: flex; align-items: center; justify-content: center;
            font-size: 46px;
            border-radius: 30px;
            background: radial-gradient(circle at 35% 30%, rgba(255, 211, 122, 0.28), rgba(255, 157, 92, 0.06) 55%, transparent 70%);
            border: 1px solid rgba(247, 184, 74, 0.28);
            box-shadow: 0 18px 44px rgba(247, 184, 74, 0.18), inset 0 1px 0 rgba(255, 255, 255, 0.12);
            animation: floaty 4.5s ease-in-out infinite;
        }
        .welcome-mark::after {
            content: '';
            position: absolute; inset: -14px;
            border-radius: 40px;
            background: radial-gradient(circle, rgba(63, 217, 255, 0.14), transparent 70%);
            z-index: -1;
            filter: blur(6px);
        }

        .welcome-title {
            font-family: var(--font-display);
            font-size: 26px; font-weight: 900;
            letter-spacing: 5px;
            background: linear-gradient(120deg, #ffffff 0%, var(--gold-2) 38%, var(--gold) 68%, var(--rose) 110%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }
        .welcome-sub {
            font-size: 12.5px; color: var(--dim);
            line-height: 1.9; letter-spacing: 0.5px;
            margin: 11px auto 24px;
            max-width: 300px;
        }

        .welcome-chips { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; max-width: 320px; margin: 0 auto; }
        .welcome-chip {
            padding: 12px 10px;
            border-radius: 14px;
            background: var(--glass);
            border: 1px solid var(--stroke);
            color: var(--text);
            font-size: 12.5px; font-weight: 600;
            font-family: var(--font-ui);
            cursor: pointer;
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            transition: all 0.22s;
        }
        .welcome-chip:hover {
            border-color: rgba(247, 184, 74, 0.55);
            color: var(--gold-2);
            transform: translateY(-2px);
            box-shadow: 0 10px 24px rgba(247, 184, 74, 0.16);
        }
        .welcome-chip:active { transform: scale(0.96); }

        /* ============================================================
           对话消息
           ============================================================ */
        .conversation { display: flex; flex-direction: column; gap: 15px; }

        .msg { display: flex; gap: 9px; animation: msgIn 0.42s cubic-bezier(0.22, 0.9, 0.32, 1.1) both; }
        .msg-user { justify-content: flex-end; }

        .bubble {
            max-width: 84%;
            padding: 11px 15px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.75;
            word-break: break-word;
            white-space: pre-wrap;
        }
        .bubble-user {
            background: linear-gradient(135deg, var(--gold-2), var(--gold) 55%, var(--amber) 100%);
            color: #241505;
            font-weight: 600;
            border-bottom-right-radius: 7px;
            box-shadow: 0 10px 26px rgba(247, 184, 74, 0.28);
        }

        .bubble-ai {
            width: 84%;
            background: var(--glass);
            border: 1px solid var(--stroke);
            border-bottom-left-radius: 7px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: var(--shadow-1);
        }

        .ai-avatar {
            flex: none;
            width: 30px; height: 30px;
            margin-top: 4px;
            border-radius: 10px;
            display: flex; align-items: center; justify-content: center;
            background: linear-gradient(135deg, var(--cyan), var(--violet));
            box-shadow: 0 5px 16px rgba(63, 217, 255, 0.35);
        }
        .ai-avatar svg { width: 15px; height: 15px; }

        .bubble-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 5px; }
        .ai-name { font-size: 12px; font-weight: 800; color: var(--cyan); letter-spacing: 0.5px; }
        .ai-time { font-size: 10px; color: var(--faint); }

        .bubble-body { font-size: 14px; line-height: 1.85; color: #dfe7f3; word-break: break-word; }
        .bubble-body p { margin: 0 0 8px; }
        .bubble-body p:last-child { margin-bottom: 0; }
        .bubble-body strong { color: #ffffff; font-weight: 800; }
        .bubble-body em { color: var(--dim); }
        .bubble-body ul, .bubble-body ol { margin: 4px 0 10px; padding-left: 20px; }
        .bubble-body li { margin: 3px 0; }
        .bubble-body h1, .bubble-body h2, .bubble-body h3, .bubble-body h4 { font-weight: 800; color: var(--gold-2); margin: 12px 0 6px; letter-spacing: 0.3px; line-height: 1.5; }
        .bubble-body h1 { font-size: 15.5px; }
        .bubble-body h2 { font-size: 15px; }
        .bubble-body h3, .bubble-body h4 { font-size: 14.5px; }
        .bubble-body code {
            background: rgba(63, 217, 255, 0.12);
            border: 1px solid rgba(63, 217, 255, 0.2);
            color: #7fe0ff;
            border-radius: 5px;
            padding: 1px 5px;
            font-size: 12px;
            font-family: 'Cascadia Code', Consolas, 'Courier New', monospace;
        }
        .bubble-body pre.md-code {
            background: rgba(2, 6, 18, 0.5);
            border: 1px solid var(--stroke);
            border-radius: 10px;
            padding: 10px 12px;
            overflow-x: auto;
            font-size: 12px;
            line-height: 1.6;
            margin: 8px 0;
            white-space: pre;
        }
        .bubble-body blockquote {
            border-left: 3px solid rgba(247, 184, 74, 0.5);
            padding: 4px 12px;
            margin: 8px 0;
            color: var(--dim);
            background: rgba(247, 184, 74, 0.06);
            border-radius: 0 8px 8px 0;
        }
        .bubble-body a { color: var(--cyan); text-decoration: underline; text-underline-offset: 2px; }
        .bubble-body hr { border: none; border-top: 1px dashed rgba(255, 255, 255, 0.15); margin: 10px 0; }

        .bubble-meta {
            display: flex; flex-wrap: wrap; gap: 4px 14px;
            margin-top: 12px; padding-top: 10px;
            border-top: 1px dashed rgba(255, 255, 255, 0.12);
            font-size: 11px; color: var(--faint);
        }

        .bubble-sources { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 11px; }
        .src-chip {
            display: inline-flex; align-items: center; gap: 6px;
            max-width: 100%;
            padding: 4px 10px 4px 5px;
            border-radius: 999px;
            background: rgba(247, 184, 74, 0.08);
            border: 1px solid rgba(247, 184, 74, 0.22);
            font-size: 11.5px;
            color: var(--gold-2);
        }
        .src-chip i {
            flex: none;
            width: 17px; height: 17px;
            border-radius: 50%;
            background: var(--gold);
            color: #241505;
            font-style: normal; font-size: 10.5px; font-weight: 800;
            display: flex; align-items: center; justify-content: center;
        }
        .src-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .src-chip em { font-style: normal; font-size: 10.5px; color: var(--faint); }

        /* ============================================================
           打字指示器
           ============================================================ */
        .typing {
            display: flex; align-items: center; gap: 11px;
            width: fit-content;
            margin-top: 2px;
            padding: 12px 15px;
            border-radius: 16px;
            background: var(--glass);
            border: 1px solid var(--stroke);
            animation: msgIn 0.3s ease both;
        }
        .typing-dots { display: flex; gap: 4px; }
        .typing-dots span {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--gold);
            animation: bounce 1.2s ease-in-out infinite;
        }
        .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.45; }
            30% { transform: translateY(-5px); opacity: 1; }
        }
        .typing-text { font-size: 12px; color: var(--dim); }

        /* ============================================================
           对比面板（矩阵视图）
           ============================================================ */
        .compare-card {
            margin-top: 6px;
            padding: 16px 14px;
            border-radius: var(--r-lg);
            background: var(--glass);
            border: 1px solid var(--stroke);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: var(--shadow-1);
            animation: fadeUp 0.4s ease both;
        }
        .compare-head {
            display: flex; align-items: center; gap: 8px;
            font-weight: 800; font-size: 14.5px;
            color: #7fe0ff;
            margin-bottom: 12px;
        }
        .compare-city {
            font-size: 10.5px; font-weight: 700;
            padding: 2px 9px;
            border-radius: 999px;
            background: rgba(63, 217, 255, 0.14);
            color: #7fe0ff;
        }
        .compare-summary { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 10px; }
        .cs-item {
            font-size: 11px; color: var(--dim);
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--stroke);
            border-radius: 999px;
            padding: 4px 10px;
        }
        .cs-item b { color: var(--gold-2); }

        .compare-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
        .cc-chip { font-size: 10.5px; font-weight: 800; padding: 3px 9px; border-radius: 999px; color: #fff; }
        .cc-bad { background: rgba(248, 113, 113, 0.9); }
        .cc-keyword { background: #64748b; }
        .cc-bm25 { background: #3b82f6; }
        .cc-vector { background: #f97316; }
        .cc-hybrid { background: #10b981; }

        .cm-table {
            display: grid;
            grid-template-columns: minmax(0, 2.1fr) repeat(4, minmax(0, 1fr));
            border: 1px solid var(--stroke);
            border-radius: 13px;
            overflow: hidden;
        }
        .cm-row { display: contents; }
        .cm-head .cm-source, .cm-head .cm-col {
            background: rgba(255, 255, 255, 0.05);
            color: var(--dim);
            font-size: 10.5px; font-weight: 800;
            padding: 8px 4px;
        }
        .cm-head .cm-source { text-align: left; padding-left: 10px; }
        .cm-source, .cm-col {
            padding: 8px 6px;
            border-top: 1px solid var(--stroke);
            min-width: 0;
        }
        .cm-source { display: flex; align-items: center; gap: 6px; font-size: 11px; color: var(--text); }
        .cm-src-rank {
            flex: none; width: 15px; height: 15px; border-radius: 5px;
            background: rgba(255, 255, 255, 0.1);
            color: var(--dim);
            font-size: 9.5px; font-weight: 800;
            display: inline-flex; align-items: center; justify-content: center;
        }
        .cm-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .cm-city {
            flex: none; font-size: 9px; color: var(--gold-2);
            background: rgba(247, 184, 74, 0.14);
            border-radius: 999px; padding: 1px 5px;
        }
        .cm-col { display: flex; align-items: center; justify-content: center; }
        .cm-rank {
            min-width: 18px; height: 18px; border-radius: 6px;
            font-size: 10px; font-weight: 800;
            display: inline-flex; align-items: center; justify-content: center;
            color: #fff;
        }
        .r-keyword { background: #64748b; }
        .r-bm25 { background: #3b82f6; }
        .r-vector { background: #f97316; }
        .r-hybrid { background: #10b981; }
        .cm-miss { color: rgba(255, 255, 255, 0.18); font-size: 12px; }
        .cm-shared .cm-source { background: rgba(247, 184, 74, 0.07); }
        .cm-shared .cm-col { background: rgba(247, 184, 74, 0.05); }
        .cm-empty { grid-column: 1 / -1; padding: 16px; text-align: center; color: var(--faint); font-size: 11.5px; }
        .compare-legend { margin-top: 10px; font-size: 10px; color: var(--faint); line-height: 1.7; }
        .lg-shared { color: var(--gold-2); font-weight: 800; }

        /* ============================================================
           底部操作区
           ============================================================ */
        .composer {
            flex: none;
            display: flex; flex-direction: column; gap: 9px;
            padding: 10px 14px calc(12px + env(safe-area-inset-bottom));
            border-top: 1px solid var(--stroke);
            background: linear-gradient(180deg, rgba(10, 16, 29, 0.15) 0%, rgba(7, 11, 20, 0.9) 100%);
        }

        .chip-scroll {
            display: flex; gap: 7px;
            overflow-x: auto;
            scrollbar-width: none;
            padding-bottom: 2px;
        }
        .chip-scroll::-webkit-scrollbar { display: none; }

        .chip {
            flex: none;
            display: inline-flex; align-items: center; gap: 5px;
            padding: 6px 12px;
            border-radius: 999px;
            border: 1px solid var(--stroke);
            background: rgba(255, 255, 255, 0.045);
            color: var(--dim);
            font-size: 12px; font-weight: 600;
            font-family: var(--font-ui);
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
        }
        .chip:hover { color: var(--text); border-color: var(--stroke-strong); transform: translateY(-1px); }
        .chip:active { transform: scale(0.95); }
        .chip.active {
            background: linear-gradient(135deg, var(--gold-2), var(--gold) 55%, var(--amber) 100%);
            border-color: transparent;
            color: #241505;
            box-shadow: 0 5px 16px rgba(247, 184, 74, 0.3);
        }
        .chip .chip-emoji { font-size: 13px; line-height: 1; }

        .method-toggle {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 4px;
            padding: 4px;
            border-radius: 13px;
            background: rgba(255, 255, 255, 0.045);
            border: 1px solid var(--stroke);
        }
        .method-option {
            padding: 7px 4px;
            border: none;
            border-radius: 9px;
            background: transparent;
            color: var(--faint);
            font-size: 11.5px; font-weight: 700;
            font-family: var(--font-ui);
            letter-spacing: 0.5px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .method-option.active {
            background: linear-gradient(135deg, rgba(63, 217, 255, 0.2), rgba(139, 124, 246, 0.2));
            color: var(--cyan);
            box-shadow: inset 0 0 0 1px rgba(63, 217, 255, 0.35);
        }
        .method-option:not(.active):hover { color: var(--text); }
        .method-toggle.dimmed { opacity: 0.5; filter: saturate(0.6); }

        .compare-banner {
            display: flex; align-items: center; justify-content: center; gap: 6px;
            padding: 7px 10px;
            border-radius: 11px;
            background: rgba(63, 217, 255, 0.08);
            border: 1px solid rgba(63, 217, 255, 0.25);
            color: #7fe0ff;
            font-size: 11.5px; font-weight: 700;
            animation: fadeUp 0.3s ease both;
        }

        .input-row { display: flex; align-items: center; gap: 9px; }

        .input-wrap {
            flex: 1;
            display: flex; align-items: center;
            padding: 4px 6px 4px 16px;
            border-radius: 999px;
            border: 1px solid var(--stroke);
            background: rgba(255, 255, 255, 0.05);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-wrap:focus-within {
            border-color: rgba(247, 184, 74, 0.6);
            box-shadow: 0 0 0 3px rgba(247, 184, 74, 0.14);
        }
        .input-wrap input {
            flex: 1;
            min-width: 0;
            border: none; outline: none;
            background: transparent;
            color: var(--text);
            font-size: 14.5px;
            padding: 10px 0;
            font-family: var(--font-ui);
        }
        .input-wrap input::placeholder { color: var(--faint); }

        .send-btn {
            flex: none;
            width: 44px; height: 44px;
            border: none; border-radius: 50%;
            background: linear-gradient(135deg, var(--gold-2), var(--gold) 55%, var(--amber) 100%);
            color: #241505;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            box-shadow: 0 7px 20px rgba(247, 184, 74, 0.35);
            transition: all 0.22s;
        }
        .send-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 11px 26px rgba(247, 184, 74, 0.45); }
        .send-btn:active:not(:disabled) { transform: scale(0.93); }
        .send-btn:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }
        .send-btn svg { width: 19px; height: 19px; margin-left: 2px; }

        /* ============================================================
           Toast 通知
           ============================================================ */
        .toast {
            position: absolute;
            top: calc(76px + env(safe-area-inset-top));
            left: 50%;
            transform: translateX(-50%);
            z-index: 40;
            display: flex; align-items: center; gap: 9px;
            max-width: calc(100% - 40px);
            padding: 11px 15px;
            border-radius: 15px;
            background: rgba(19, 27, 44, 0.94);
            border: 1px solid var(--stroke-strong);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
            font-size: 12.5px;
            color: var(--text);
            animation: toastIn 0.3s cubic-bezier(0.22, 0.9, 0.32, 1) both;
        }
        .toast.warn { border-color: rgba(251, 191, 36, 0.4); }
        .toast.error { border-color: rgba(248, 113, 113, 0.45); }
        .toast.ok { border-color: rgba(52, 211, 153, 0.4); }
        .toast-icon { flex: none; font-size: 14px; line-height: 1; }
        .toast-text { line-height: 1.6; }
        .toast-btn {
            flex: none;
            margin-left: 2px;
            padding: 5px 13px;
            border: none; border-radius: 999px;
            background: linear-gradient(135deg, var(--gold-2), var(--gold) 55%, var(--amber) 100%);
            color: #241505;
            font-size: 12px; font-weight: 800;
            font-family: var(--font-ui);
            cursor: pointer;
        }
        .toast-btn:hover { filter: brightness(1.06); }
        @keyframes toastIn {
            from { opacity: 0; transform: translate(-50%, -12px); }
            to { opacity: 1; transform: translate(-50%, 0); }
        }

        /* ============================================================
           历史抽屉（底部弹出）
           ============================================================ */
        .sheet-backdrop {
            position: absolute; inset: 0; z-index: 50;
            background: rgba(3, 6, 12, 0.55);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        .sheet-backdrop.show { opacity: 1; pointer-events: auto; }

        .bottom-sheet {
            position: absolute; left: 0; right: 0; bottom: 0; z-index: 60;
            max-height: 68%;
            display: flex; flex-direction: column;
            background: linear-gradient(180deg, #101a30 0%, #0a101d 100%);
            border: 1px solid var(--stroke);
            border-bottom: none;
            border-radius: 26px 26px 0 0;
            box-shadow: 0 -22px 60px rgba(0, 0, 0, 0.6);
            transform: translateY(103%);
            transition: transform 0.36s cubic-bezier(0.3, 0.9, 0.3, 1);
        }
        .bottom-sheet.open { transform: translateY(0); }

        .sheet-handle {
            width: 44px; height: 5px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.18);
            margin: 10px auto 4px;
        }
        .sheet-head {
            display: flex; align-items: center; justify-content: space-between;
            padding: 8px 18px 10px;
        }
        .sheet-head h3 { font-size: 14px; font-weight: 800; letter-spacing: 1.5px; }
        .sheet-clear {
            border: none;
            background: transparent;
            color: var(--faint);
            font-size: 11.5px;
            font-family: var(--font-ui);
            cursor: pointer;
            padding: 4px 9px;
            border-radius: 8px;
            transition: all 0.15s;
        }
        .sheet-clear:hover { color: var(--err); background: rgba(248, 113, 113, 0.12); }

        .sheet-list {
            flex: 1;
            overflow-y: auto;
            padding: 4px 14px calc(22px + env(safe-area-inset-bottom));
        }
        .history-item {
            padding: 11px 12px;
            border-radius: 13px;
            border: 1px solid transparent;
            cursor: pointer;
            transition: background 0.15s, border-color 0.15s;
        }
        .history-item:hover { background: rgba(255, 255, 255, 0.05); border-color: var(--stroke); }
        .h-item-q { font-size: 13.5px; font-weight: 600; color: var(--text); }
        .h-item-meta { font-size: 11px; color: var(--faint); margin-top: 4px; }
        .h-empty { text-align: center; color: var(--faint); font-size: 12.5px; padding: 34px 0; }

        /* ============================================================
           动画与响应式
           ============================================================ */
        @keyframes msgIn {
            from { opacity: 0; transform: translateY(13px) scale(0.985); }
            to { opacity: 1; transform: none; }
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(14px); }
            to { opacity: 1; transform: none; }
        }
        @keyframes floaty {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-9px); }
        }

        @media (min-width: 521px) {
            body { padding: 26px; }
            .app-shell {
                height: min(900px, 96dvh);
                border-radius: 30px;
                border: 1px solid rgba(255, 255, 255, 0.1);
            }
            .topbar { border-radius: 30px 30px 0 0; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation: none !important;
                transition: none !important;
            }
        }

        @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
            .app-shell { background: #0a101d; }
            .bubble-ai, .compare-card, .welcome-chip, .toast { background: #111a2e; }
        }
    </style>
</head>
<body>
    <!-- 背景装饰 -->
    <div class="bg" aria-hidden="true">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="grain"></div>
    </div>

    <div class="app-shell">
        <!-- ========== 顶栏 ========== -->
        <header class="topbar">
            <div class="brand">
                <div class="brand-mark">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#241505" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 19.5h18"/>
                        <path d="M5.2 19.5 10 11.5l3.2 4.1 2.1-2.9 3.5 6.8"/>
                        <circle cx="16.8" cy="6.2" r="2.3" fill="#241505" stroke="none"/>
                    </svg>
                </div>
                <div class="brand-text">
                    <h1>走遍中国</h1>
                    <p>智能旅游助手</p>
                </div>
            </div>
            <div class="topbar-actions">
                <div class="status-pill" id="status-pill" title="后端连接状态">
                    <span class="dot"></span>
                    <span id="status-label">连接中</span>
                </div>
                <button type="button" class="icon-btn" id="history-btn" aria-label="问答历史" title="最近问答">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>
                    </svg>
                </button>
                <button type="button" class="icon-btn" id="clear-btn" aria-label="清空对话" title="清空对话">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/>
                        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6M14 11v6"/>
                    </svg>
                </button>
            </div>
        </header>

        <!-- ========== 聊天滚动区 ========== -->
        <main class="chat-scroll" id="chat-scroll">
            <!-- 欢迎页 -->
            <section class="welcome" id="welcome">
                <div class="welcome-mark">🏔️</div>
                <h2 class="welcome-title">下一站，去哪？</h2>
                <p class="welcome-sub">覆盖 8 个热门旅游城市<br>景点 · 美食 · 交通 · 行程 一站式问答</p>
                <div class="welcome-chips" id="welcome-chips"><!-- 由 JS 动态生成 --></div>
            </section>

            <!-- 对话流 -->
            <div id="conversation" class="conversation"></div>

            <!-- 打字指示器 -->
            <div class="typing" id="typing" hidden>
                <div class="typing-dots"><span></span><span></span><span></span></div>
                <span class="typing-text" id="typing-text">正在检索知识库…</span>
            </div>

            <!-- 检索方式对比矩阵 -->
            <div class="compare-card" id="compare-card" hidden></div>
        </main>

        <!-- ========== 底部操作区 ========== -->
        <footer class="composer">
            <!-- 城市快捷筛选 -->
            <div class="chip-scroll" id="city-chips"><!-- 城市 chips 由 JS 动态生成 --></div>

            <!-- 检索方式 -->
            <div class="method-toggle" id="method-toggle" role="group" aria-label="选择检索方式">
                <button type="button" class="method-option active" data-method="bm25">BM25</button>
                <button type="button" class="method-option" data-method="keyword">关键词</button>
                <button type="button" class="method-option" data-method="vector">向量</button>
                <button type="button" class="method-option" data-method="hybrid">混合</button>
            </div>
            <div class="compare-banner" id="compare-banner" hidden>⚖️ 对比模式 · 四种检索方式横向对比</div>

            <!-- 输入行 -->
            <div class="input-row">
                <div class="input-wrap">
                    <input
                        type="text"
                        id="question-input"
                        placeholder="问点什么，比如：成都三天怎么玩？"
                        autocomplete="off"
                        maxlength="500"
                    >
                </div>
                <button type="button" class="send-btn" id="ask-btn" aria-label="发送">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path d="M3.4 20.4l17.4-7.5c.8-.34.8-1.5 0-1.84L3.4 3.6c-.66-.3-1.4.27-1.4 1v4.9c0 .5.36.93.85 1L14 12 2.85 14.5c-.49.07-.85.5-.85 1v4.9c0 .73.74 1.3 1.4 1z"/>
                    </svg>
                </button>
            </div>

            <!-- 快捷提问标签 -->
            <div class="chip-scroll" id="quick-tags"><!-- 快捷标签由 JS 动态生成 --></div>
        </footer>

        <!-- ========== 历史抽屉 ========== -->
        <div class="sheet-backdrop" id="sheet-backdrop"></div>
        <section class="bottom-sheet" id="history-sheet" aria-label="最近问答">
            <div class="sheet-handle"></div>
            <div class="sheet-head">
                <h3>最近问答</h3>
                <button type="button" class="sheet-clear" id="history-clear">清空记录</button>
            </div>
            <div class="sheet-list" id="history-list"></div>
        </section>

        <!-- ========== Toast ========== -->
        <div class="toast" id="toast" hidden></div>
    </div>

    <script>
    /* ============================================================
       走遍中国 · 智能旅游助手 — 交互逻辑
       API 契约保持不变：/api/cities /api/ask /api/health
       ============================================================ */

    // API 地址自动适配：手机访问时用同源地址，本地文件打开时用 localhost
    const API_BASE = window.location.origin.startsWith('http')
        ? window.location.origin
        : 'http://localhost:8000';

    // 状态
    const compareMode = location.pathname.includes('/compare');
    const HISTORY_KEY = 'travel_qa_history';
    const MAX_HISTORY = 20;

    const CITY_EMOJI_MAP = {
        '北京': '🏯', '杭州': '🌸', '成都': '🐼', '西安': '⚔️',
        '重庆': '🌆', '广州': '🥟', '苏州': '🏡', '长沙': '🌶️',
    };
    const METHOD_LABELS = { bm25: 'BM25', keyword: '关键词', vector: '向量', hybrid: '混合' };

    // DOM
    const $ = (id) => document.getElementById(id);
    const els = {
        chatScroll: $('chat-scroll'),
        conversation: $('conversation'),
        welcome: $('welcome'),
        welcomeChips: $('welcome-chips'),
        cityChips: $('city-chips'),
        methodToggle: $('method-toggle'),
        compareBanner: $('compare-banner'),
        questionInput: $('question-input'),
        askBtn: $('ask-btn'),
        clearBtn: $('clear-btn'),
        historyBtn: $('history-btn'),
        historyClear: $('history-clear'),
        typing: $('typing'),
        typingText: $('typing-text'),
        quickTags: $('quick-tags'),
        compareCard: $('compare-card'),
        toast: $('toast'),
        statusPill: $('status-pill'),
        statusLabel: $('status-label'),
        sheet: $('history-sheet'),
        sheetBackdrop: $('sheet-backdrop'),
        historyList: $('history-list'),
    };

    let currentMethod = 'bm25';
    let currentCity = '';
    let abortController = null;
    let typingTimer = null;
    let toastTimer = null;
    let healthNotified = false;
    window._cityList = []; // 全局城市名缓存，供 extractCityFromQuestion 使用

    // 对比模式：仅通过 /compare 地址进入
    if (compareMode) {
        els.compareBanner.hidden = false;
        els.methodToggle.classList.add('dimmed');
    }

    // ========== 初始化 ==========
    async function init() {
        await loadCities();   // 先从后端加载城市列表
        loadHistory();
        bindEvents();
        checkHealth();
    }

    // ========== 从后端动态加载城市信息 ==========
    async function loadCities() {
        try {
            const res = await fetch(`${API_BASE}/api/cities`);
            if (!res.ok) throw new Error('Failed');
            const cities = await res.json();

            // 缓存城市名列表
            window._cityList = cities.map(c => c.city);

            // 1. 渲染城市 chips（全部 + 各城市）
            els.cityChips.innerHTML = '';
            els.cityChips.appendChild(makeChip('🌍', '全部', ''));
            cities.forEach(c => {
                const emoji = CITY_EMOJI_MAP[c.city] || '📍';
                els.cityChips.appendChild(makeChip(emoji, c.city, c.city));
            });

            // 2. 动态生成快捷标签（从各城市采样热门关键词）
            const sampleQueries = [
                { q: '北京故宫门票多少钱？', label: '北京故宫' },
                { q: '成都火锅有什么推荐？', label: '成都火锅' },
                { q: '西安兵马俑怎么去？', label: '西安兵马俑' },
                { q: '长沙橘子洲怎么玩？', label: '长沙橘子洲' },
                { q: '广州早茶推荐什么？', label: '广州早茶' },
                { q: '苏州园林一天能逛几个？', label: '苏州园林' },
                { q: '重庆三天两晚怎么安排？', label: '重庆三日游' },
                { q: '杭州西湖有哪些景点？', label: '杭州西湖' },
            ];
            // 只展示已覆盖城市的快捷标签
            const coveredCities = cities.map(c => c.city);
            const tagsContainer = els.quickTags;
            tagsContainer.innerHTML = '';
            sampleQueries.forEach(item => {
                const matchedCity = coveredCities.find(city => item.q.includes(city));
                if (matchedCity || item.q.includes('三天') || item.q.includes('早茶')) {
                    const tag = document.createElement('button');
                    tag.type = 'button';
                    tag.className = 'chip quick-tag';
                    tag.dataset.q = item.q;
                    tag.textContent = item.label;
                    tagsContainer.appendChild(tag);
                }
            });

            // 3. 欢迎页示例问题（取前 4 个快捷标签）
            els.welcomeChips.innerHTML = '';
            [...tagsContainer.children].slice(0, 4).forEach(tag => {
                const btn = document.createElement('button');
                btn.type = 'button';
                btn.className = 'welcome-chip';
                btn.dataset.q = tag.dataset.q;
                btn.textContent = tag.textContent;
                els.welcomeChips.appendChild(btn);
            });

            console.log(`✅ ${cities.length} 个城市已加载：${window._cityList.join('、')}`);
        } catch (e) {
            console.warn('⚠️ 无法加载城市列表，使用默认值', e);
        }
    }

    function makeChip(emoji, label, value) {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'chip';
        chip.dataset.city = value || '';
        chip.innerHTML = `<span class="chip-emoji">${emoji}</span><span>${label}</span>`;
        return chip;
    }

    // ========== 事件绑定 ==========
    function bindEvents() {
        // 提问
        els.askBtn.addEventListener('click', () => askQuestion());

        // 清空对话
        els.clearBtn.addEventListener('click', clearAll);

        // 历史抽屉
        els.historyBtn.addEventListener('click', toggleSheet);
        els.sheetBackdrop.addEventListener('click', closeSheet);
        els.historyClear.addEventListener('click', () => {
            try { localStorage.removeItem(HISTORY_KEY); } catch (e) { /* ignore */ }
            renderHistory();
            showToast('问答记录已清空', 'ok');
        });

        // 检索方式切换
        els.methodToggle.addEventListener('click', (e) => {
            const btn = e.target.closest('.method-option');
            if (!btn) return;
            currentMethod = btn.dataset.method;
            els.methodToggle.querySelectorAll('.method-option').forEach(b => b.classList.toggle('active', b === btn));
        });

        // 回车键提问
        els.questionInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                askQuestion();
            }
        });

        // 城市 chips 点击
        els.cityChips.addEventListener('click', (e) => {
            const chip = e.target.closest('.chip');
            if (!chip) return;
            const city = chip.dataset.city || '';
            setCityFilter(city);
            if (city && !els.questionInput.value.trim()) {
                els.questionInput.value = `${city}有什么好玩的地方？`;
            }
            els.questionInput.focus();
        });

        // 快捷标签点击
        els.quickTags.addEventListener('click', (e) => {
            const tag = e.target.closest('.quick-tag');
            if (!tag) return;
            runQuickQuery(tag.dataset.q);
        });

        // 欢迎页示例点击
        els.welcomeChips.addEventListener('click', (e) => {
            const btn = e.target.closest('.welcome-chip');
            if (!btn) return;
            runQuickQuery(btn.dataset.q);
        });
    }

    function runQuickQuery(q) {
        els.questionInput.value = q;
        const city = extractCityFromQuestion(q);
        if (city) setCityFilter(city);
        askQuestion();
    }

    function setCityFilter(city) {
        currentCity = city;
        els.cityChips.querySelectorAll('.chip').forEach(c => {
            c.classList.toggle('active', c.dataset.city === city);
        });
    }

    // ========== 辅助函数 ==========
    function extractCityFromQuestion(q) {
        const cities = window._cityList || [];
        for (const city of cities) {
            if (q.includes(city)) return city;
        }
        return '';
    }

    function scrollToBottom() {
        requestAnimationFrame(() => {
            els.chatScroll.scrollTo({ top: els.chatScroll.scrollHeight, behavior: 'smooth' });
        });
    }

    // ========== 打字指示器 ==========
    function showTyping(mode) {
        els.typing.hidden = false;
        const stages = mode === 'compare'
            ? ['正在并行检索四种方式…', '正在汇总召回结果…']
            : ['正在检索知识库…', '正在组织答案…', '马上就好…'];
        let i = 0;
        els.typingText.textContent = stages[0];
        clearInterval(typingTimer);
        typingTimer = setInterval(() => {
            i = (i + 1) % stages.length;
            els.typingText.textContent = stages[i];
        }, 2400);
        scrollToBottom();
    }

    function hideTyping() {
        els.typing.hidden = true;
        clearInterval(typingTimer);
    }

    // ========== Toast ==========
    function showToast(text, type = 'info', retryable = false) {
        const icons = { info: 'ℹ️', warn: '⚠️', error: '⚠️', ok: '✅' };
        let html = `<span class="toast-icon">${icons[type] || 'ℹ️'}</span><span class="toast-text">${text}</span>`;
        if (retryable) html += `<button type="button" class="toast-btn" id="toast-retry">重试</button>`;
        els.toast.className = 'toast ' + type;
        els.toast.innerHTML = html;
        els.toast.hidden = false;
        const retry = els.toast.querySelector('#toast-retry');
        if (retry) retry.addEventListener('click', () => { hideToast(); askQuestion(); });
        clearTimeout(toastTimer);
        if (type !== 'error') toastTimer = setTimeout(hideToast, 4200);
    }

    function hideToast() {
        els.toast.hidden = true;
        clearTimeout(toastTimer);
    }

    // ========== 轻量 Markdown 渲染（先转义防 XSS，再解析格式） ==========
    function renderMarkdown(text) {
        if (!text) return '';
        const lines = escapeHtml(text).split('\n');
        let html = '';
        let listType = null; // 'ul' | 'ol'
        let inCode = false;
        let codeBuf = [];

        const closeList = () => {
            if (listType) { html += `</${listType}>`; listType = null; }
        };

        for (const rawLine of lines) {
            // 代码块
            if (/^\s*```/.test(rawLine)) {
                if (inCode) {
                    html += '<pre class="md-code">' + codeBuf.join('\n') + '</pre>';
                    codeBuf = [];
                    inCode = false;
                } else {
                    closeList();
                    inCode = true;
                }
                continue;
            }
            if (inCode) { codeBuf.push(rawLine); continue; }

            // 标题
            const h = rawLine.match(/^(#{1,4})\s+(.*)/);
            if (h) { closeList(); html += `<h${h[1].length}>${inlineMd(h[2])}</h${h[1].length}>`; continue; }

            // 无序列表
            const ul = rawLine.match(/^\s*[-*+]\s+(.*)/);
            if (ul) {
                if (listType !== 'ul') { closeList(); listType = 'ul'; html += '<ul>'; }
                html += `<li>${inlineMd(ul[1])}</li>`;
                continue;
            }

            // 有序列表
            const ol = rawLine.match(/^\s*\d+[.、)]\s+(.*)/);
            if (ol) {
                if (listType !== 'ol') { closeList(); listType = 'ol'; html += '<ol>'; }
                html += `<li>${inlineMd(ol[1])}</li>`;
                continue;
            }

            // 引用
            const bq = rawLine.match(/^\s*>\s?(.*)/);
            if (bq) { closeList(); html += `<blockquote>${inlineMd(bq[1])}</blockquote>`; continue; }

            // 分隔线
            if (/^\s*([-*_]\s*){3,}\s*$/.test(rawLine)) { closeList(); html += '<hr>'; continue; }

            closeList();
            if (rawLine.trim() === '') { continue; }
            html += `<p>${inlineMd(rawLine)}</p>`;
        }

        if (inCode) html += '<pre class="md-code">' + codeBuf.join('\n') + '</pre>';
        closeList();
        return html;
    }

    function inlineMd(s) {
        return s
            .replace(/`([^`]+)`/g, '<code>$1</code>')
            .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
            .replace(/__([^_]+)__/g, '<strong>$1</strong>')
            .replace(/\*([^*]+)\*/g, '<em>$1</em>')
            .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');
    }

    // ========== 消息渲染 ==========
    function pushUserMessage(text) {
        els.welcome.hidden = true;
        const wrap = document.createElement('div');
        wrap.className = 'msg msg-user';
        const bubble = document.createElement('div');
        bubble.className = 'bubble bubble-user';
        bubble.textContent = text;
        wrap.appendChild(bubble);
        els.conversation.appendChild(wrap);
        scrollToBottom();
    }

    function pushAiMessage(data) {
        els.welcome.hidden = true;
        const wrap = document.createElement('div');
        wrap.className = 'msg msg-ai';

        let meta = '';
        if (data.detected_city) meta += `<span>📍 ${escapeHtml(data.detected_city)}</span>`;
        if (data.retrieval_method) meta += `<span>🔍 ${escapeHtml(METHOD_LABELS[data.retrieval_method] || data.retrieval_method)}</span>`;
        if (data.model) meta += `<span>🤖 ${escapeHtml(data.model)}</span>`;

        let sources = '';
        if (data.sources && data.sources.length > 0) {
            sources = '<div class="bubble-sources">';
            data.sources.forEach((src, idx) => {
                sources += `<span class="src-chip"><i>${idx + 1}</i><span class="src-title">${escapeHtml(src.title || '')}</span>${src.city ? `<em>${escapeHtml(src.city)}</em>` : ''}</span>`;
            });
            sources += '</div>';
        }

        wrap.innerHTML = `
            <div class="ai-avatar">
                <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2.5l2.3 7.2 7.2 2.3-7.2 2.3L12 21.5l-2.3-7.2-7.2-2.3 7.2-2.3z"/>
                    <path d="M19 3.5l.9 2.6 2.6.9-2.6.9-.9 2.6-.9-2.6-2.6-.9 2.6-.9z"/>
                </svg>
            </div>
            <div class="bubble bubble-ai">
                <div class="bubble-head">
                    <span class="ai-name">走遍中国助手</span>
                    <span class="ai-time">${formatTime(new Date().toISOString())}</span>
                </div>
                <div class="bubble-body"></div>
                <div class="bubble-meta">${meta}</div>
                ${sources}
            </div>`;
        wrap.querySelector('.bubble-body').innerHTML = renderMarkdown(data.answer || '');
        els.conversation.appendChild(wrap);
        scrollToBottom();
    }

    // ========== 对比矩阵渲染 ==========
    function renderCompare(data) {
        const METHODS = [
            { method: 'keyword', label: '关键词' },
            { method: 'bm25', label: 'BM25' },
            { method: 'vector', label: '向量' },
            { method: 'hybrid', label: '混合' },
        ];

        // 按来源 id 聚合四种方式的召回
        const byId = new Map();
        data.methods.forEach(m => {
            if (m.status !== 'ok') return;
            m.results.forEach((r, idx) => {
                const id = r.id || r.title || '';
                if (!byId.has(id)) {
                    byId.set(id, { id: id, title: r.title || '', city: r.city || '', foundBy: [] });
                }
                byId.get(id).foundBy.push({ method: m.method, rank: idx + 1 });
            });
        });
        const sources = Array.from(byId.values());
        sources.forEach(s => {
            s.bestRank = Math.min(...s.foundBy.map(f => f.rank));
            s.foundCount = s.foundBy.length;
        });
        // 被越多方式召回越靠前，其次看最佳名次
        sources.sort((a, b) => (b.foundCount - a.foundCount) || (a.bestRank - b.bestRank));

        // 摘要：Top1 一致性
        const okMethods = data.methods.filter(m => m.status === 'ok' && m.results.length > 0);
        const top1Counts = {};
        okMethods.forEach(m => {
            const id = m.results[0].id || m.results[0].title || '';
            top1Counts[id] = (top1Counts[id] || 0) + 1;
        });
        const top1Best = Math.max(0, ...Object.values(top1Counts));

        let html = '<div class="compare-head"><span>⚖️</span> 检索方式对比';
        if (data.detected_city) {
            html += ` <span class="compare-city">${escapeHtml(data.detected_city)}</span>`;
        }
        html += '</div>';

        html += '<div class="compare-summary">';
        html += `<span class="cs-item">召回来源 <b>${sources.length}</b> 条</span>`;
        if (okMethods.length > 0) {
            html += `<span class="cs-item">Top1 一致 <b>${top1Best}/${okMethods.length}</b></span>`;
        }
        html += '</div>';

        html += '<div class="compare-chips">';
        data.methods.forEach(m => {
            const text = m.status === 'ok'
                ? `${m.label} ${m.latency_ms}ms`
                : `${m.label} ${m.status === 'unavailable' ? '不可用' : '出错'}`;
            html += `<span class="cc-chip ${m.status === 'ok' ? 'cc-' + m.method : 'cc-bad'}">${escapeHtml(text)}</span>`;
        });
        html += '</div>';

        html += '<div class="cm-table">';
        html += '<div class="cm-row cm-head"><div class="cm-source">来源</div>';
        METHODS.forEach(m => { html += `<div class="cm-col">${m.label}</div>`; });
        html += '</div>';

        if (sources.length === 0) {
            html += '<div class="cm-empty">无召回结果</div>';
        } else {
            sources.forEach((s, idx) => {
                html += `<div class="cm-row${s.foundCount > 1 ? ' cm-shared' : ''}">`;
                html += `<div class="cm-source"><span class="cm-src-rank">${idx + 1}</span><span class="cm-title" title="${escapeHtml(s.title)}">${escapeHtml(s.title)}</span>${s.city ? `<span class="cm-city">${escapeHtml(s.city)}</span>` : ''}</div>`;
                METHODS.forEach(m => {
                    const f = s.foundBy.find(x => x.method === m.method);
                    if (!f) {
                        html += '<div class="cm-col"><span class="cm-miss">—</span></div>';
                    } else {
                        html += `<div class="cm-col"><span class="cm-rank r-${m.method}">${f.rank}</span></div>`;
                    }
                });
                html += '</div>';
            });
        }
        html += '</div>';

        html += '<div class="compare-legend">数字＝该方式中的名次 · —＝未召回 · <span class="lg-shared">高亮行</span>＝多种方式共同召回</div>';

        els.compareCard.innerHTML = html;
        els.compareCard.hidden = false;
        scrollToBottom();
    }

    // ========== 对比模式：分别请求四种检索方式 ==========
    async function runCompare(question, city) {
        const methods = [
            { method: 'keyword', label: '关键词匹配' },
            { method: 'bm25', label: 'BM25' },
            { method: 'vector', label: '向量相似度' },
            { method: 'hybrid', label: 'BM25+向量' },
        ];

        let vectorStatus = 'not_loaded';
        try {
            const h = await fetch(`${API_BASE}/api/health`);
            if (h.ok) {
                vectorStatus = (await h.json()).vector_retrieval || 'not_loaded';
            }
        } catch (e) { /* 忽略 */ }

        const out = [];
        let detectedCity = city || null;
        for (const m of methods) {
            const t0 = performance.now();
            let status = 'ok';
            let results = [];
            try {
                const res = await fetch(`${API_BASE}/api/ask`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question: question,
                        city: city,
                        top_k: 3,
                        method: m.method,
                        raw: true,
                    }),
                    signal: abortController.signal,
                });
                if (!res.ok) throw new Error('http ' + res.status);
                const data = await res.json();
                if (!detectedCity && data.detected_city) {
                    detectedCity = data.detected_city;
                }
                results = data.sources || [];
            } catch (e) {
                if (e.name === 'AbortError') throw e;
                status = 'error';
            }
            if ((m.method === 'vector' || m.method === 'hybrid') && vectorStatus === 'unavailable') {
                status = 'unavailable';
                results = [];
            }
            out.push({
                method: m.method,
                label: m.label,
                status: status,
                latency_ms: Math.round(performance.now() - t0),
                results: results,
            });
        }
        return { question: question, detected_city: detectedCity, methods: out };
    }

    // ========== 核心：提问 ==========
    async function askQuestion() {
        const question = els.questionInput.value.trim();

        // 空问题检查
        if (!question) {
            showToast('请输入您的问题', 'warn');
            els.questionInput.focus();
            return;
        }

        // 敏感词简单过滤
        const sensitivePatterns = /[黄赌毒]|赌博|色情|违法/;
        if (sensitivePatterns.test(question)) {
            showToast('请提出与旅游相关的问题', 'warn');
            return;
        }

        // UI 状态
        hideToast();
        els.compareCard.hidden = true;
        showTyping(compareMode ? 'compare' : 'normal');
        els.askBtn.disabled = true;

        // 取消之前的请求
        if (abortController) {
            abortController.abort();
        }
        abortController = new AbortController();

        const city = currentCity || null;

        try {
            let data;
            if (compareMode) {
                data = await runCompare(question, city);
            } else {
                const res = await fetch(`${API_BASE}/api/ask`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question: question,
                        city: city,
                        top_k: 5,
                        method: currentMethod
                    }),
                    signal: abortController.signal,
                });

                if (!res.ok) {
                    if (res.status === 400) {
                        const errData = await res.json();
                        throw new Error(errData.detail || '输入有误');
                    } else if (res.status === 422) {
                        const errData = await res.json();
                        const msg = errData.detail?.[0]?.msg || '输入格式有误';
                        throw new Error(msg);
                    } else if (res.status >= 500) {
                        throw new Error('服务器内部错误，请稍后重试');
                    }
                    throw new Error(`请求失败 (${res.status})`);
                }
                data = await res.json();
            }

            // 先上屏用户问题
            pushUserMessage(question);

            if (compareMode) {
                renderCompare(data);
            } else {
                pushAiMessage(data);
                saveToHistory(question, data);
                renderHistory();
            }

        } catch (err) {
            if (err.name === 'AbortError') {
                // 用户取消，不报错
                return;
            }
            if (err.message.includes('Failed to fetch') || err.message.includes('NetworkError')) {
                showError('请求失败，请确认后端已启动（localhost:8000）<br><small>启动命令：<code>cd backend &amp;&amp; uvicorn main:app --host 0.0.0.0 --port 8000</code></small>');
            } else if (err.message.includes('timeout') || err.message.includes('Timeout')) {
                showError('服务器响应超时，请重试');
            } else {
                showError(escapeHtml(err.message));
            }
        } finally {
            hideTyping();
            els.askBtn.disabled = false;
            abortController = null;
        }
    }

    function showError(text) {
        showToast(text, 'error', true);
    }

    // ========== 清空对话 ==========
    function clearAll() {
        if (abortController) abortController.abort();
        els.conversation.innerHTML = '';
        els.compareCard.hidden = true;
        els.questionInput.value = '';
        setCityFilter('');
        els.welcome.hidden = false;
        hideTyping();
        hideToast();
        els.chatScroll.scrollTop = 0;
    }

    // ========== 后端健康检查 ==========
    async function checkHealth() {
        try {
            const res = await fetch(`${API_BASE}/api/health`, { signal: AbortSignal.timeout(3000) });
            if (res.ok) {
                setStatus('online');
                console.log('✅ 后端连接成功');
            } else {
                setStatus('offline');
            }
        } catch (e) {
            setStatus('offline');
            console.warn('⚠️ 后端未启动，请执行: cd backend && uvicorn main:app --host 0.0.0.0 --port 8000');
            if (!healthNotified) {
                healthNotified = true;
                showToast('后端服务未启动<br><small>请执行：<code>cd backend &amp;&amp; uvicorn main:app --host 0.0.0.0 --port 8000</code></small>', 'warn');
            }
        }
    }

    function setStatus(s) {
        els.statusPill.classList.remove('online', 'offline');
        if (s === 'online') {
            els.statusPill.classList.add('online');
            els.statusLabel.textContent = '在线';
        } else {
            els.statusPill.classList.add('offline');
            els.statusLabel.textContent = '离线';
        }
    }

    // ========== 问答历史 (localStorage) ==========
    function getHistory() {
        try {
            const raw = localStorage.getItem(HISTORY_KEY);
            return raw ? JSON.parse(raw) : [];
        } catch (e) {
            return [];
        }
    }

    function saveToHistory(question, data) {
        const history = getHistory();
        history.unshift({
            question: question,
            answer: data.answer ? data.answer.substring(0, 100) + '...' : '',
            detected_city: data.detected_city,
            timestamp: new Date().toISOString(),
            fullData: data,
        });
        // 限制数量
        if (history.length > MAX_HISTORY) {
            history.length = MAX_HISTORY;
        }
        try {
            localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        } catch (e) {
            // localStorage 满，清除旧记录
            history.length = 10;
            localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        }
    }

    function renderHistory() {
        const history = getHistory();
        if (history.length === 0) {
            els.historyList.innerHTML = '<div class="h-empty">暂无问答记录</div>';
            return;
        }
        els.historyList.innerHTML = history.slice(0, 10).map((item, idx) => `
            <div class="history-item" data-idx="${idx}">
                <div class="h-item-q">${escapeHtml(item.question)}</div>
                <div class="h-item-meta">${item.detected_city ? '📍 ' + escapeHtml(item.detected_city) + ' · ' : ''}${formatTime(item.timestamp)}</div>
            </div>
        `).join('');

        // 点击历史记录恢复
        els.historyList.querySelectorAll('.history-item').forEach(el => {
            el.addEventListener('click', () => {
                const idx = parseInt(el.dataset.idx);
                const history = getHistory();
                const item = history[idx];
                if (item && item.fullData) {
                    els.questionInput.value = item.question;
                    if (item.fullData.detected_city) {
                        setCityFilter(item.fullData.detected_city);
                    }
                    closeSheet();
                    pushUserMessage(item.question);
                    pushAiMessage(item.fullData);
                }
            });
        });
    }

    function loadHistory() {
        renderHistory();
    }

    // ========== 历史抽屉开关 ==========
    function toggleSheet() {
        const open = !els.sheet.classList.contains('open');
        els.sheet.classList.toggle('open', open);
        els.sheetBackdrop.classList.toggle('show', open);
        if (open) renderHistory();
    }

    function closeSheet() {
        els.sheet.classList.remove('open');
        els.sheetBackdrop.classList.remove('show');
    }

    // ========== 工具函数 ==========
    function formatTime(isoStr) {
        try {
            const d = new Date(isoStr);
            const now = new Date();
            const diff = now - d;
            if (diff < 60000) return '刚刚';
            if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
            if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
            return d.toLocaleDateString('zh-CN');
        } catch (e) {
            return '';
        }
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // ========== 启动 ==========
    init();
    console.log('🏔️ 走遍中国 · 智能旅游助手 已就绪');
    console.log('💡 快捷操作：点击城市卡片、快捷标签，或直接输入问题后按回车');
    </script>
