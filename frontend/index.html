<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>走遍中国 · 智能旅游助手</title>
    <style>
        /* ============================================================
           CSS Reset & Base — 移动优先 (Mobile-First)
           ============================================================ */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --primary: #f97316;
            --primary-dark: #ea580c;
            --primary-deep: #c2410c;
            --primary-light: #ffedd5;
            --accent: #0ea5e9;
            --accent-light: #e0f2fe;
            --success: #16a34a;
            --warning: #f59e0b;
            --danger: #ef4444;
            --bg: #fffaf6;
            --card-bg: #ffffff;
            --text: #292524;
            --text-secondary: #8a8178;
            --border: #f5e9dd;
            --shadow: 0 1px 3px rgba(120, 60, 20, 0.06), 0 4px 12px rgba(120, 60, 20, 0.05);
            --shadow-lg: 0 18px 40px rgba(154, 94, 34, 0.16), 0 6px 16px rgba(154, 94, 34, 0.08);
            --radius: 18px;
            --radius-sm: 12px;
            --font: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        }

        body {
            font-family: var(--font);
            background: linear-gradient(160deg, #fff7ed 0%, #fef3c7 45%, #ecfeff 100%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 0;
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
            background:
                radial-gradient(560px 320px at 8% 6%, rgba(251, 146, 60, 0.16), transparent 62%),
                radial-gradient(520px 320px at 92% 18%, rgba(14, 165, 233, 0.14), transparent 62%),
                radial-gradient(640px 400px at 50% 108%, rgba(244, 63, 94, 0.12), transparent 65%);
        }

        /* 移动端容器：最大宽度 414px */
        .app-container {
            width: 100%;
            max-width: 414px;
            min-height: 100vh;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            box-shadow: var(--shadow-lg);
            position: relative;
            z-index: 1;
        }

        /* ============================================================
           顶部标题栏
           ============================================================ */
        .header {
            background: linear-gradient(135deg, #fbbf24 0%, #f97316 50%, #f43f5e 100%);
            color: white;
            padding: 28px 16px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header::before {
            content: '';
            position: absolute;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.22) 0%, rgba(255, 255, 255, 0) 70%);
            top: -90px;
            right: -60px;
            pointer-events: none;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            right: 0;
            height: 24px;
            background: var(--bg);
            border-radius: 24px 24px 0 0;
        }

        .header-icon {
            font-size: 38px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 68px;
            height: 68px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(190, 60, 20, 0.25);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .header h1 {
            font-size: 21px;
            font-weight: 800;
            letter-spacing: 1px;
            text-shadow: 0 2px 8px rgba(190, 60, 20, 0.25);
        }

        .header .subtitle {
            font-size: 13px;
            opacity: 0.92;
            margin-top: 4px;
            letter-spacing: 0.5px;
        }

        /* ============================================================
           主内容区
           ============================================================ */
        .main-content {
            flex: 1;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* ============================================================
           城市选择器
           ============================================================ */
        .city-selector {
            position: relative;
        }

        .city-selector select {
            width: 100%;
            padding: 12px 36px 12px 15px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 15px;
            color: var(--text);
            background: var(--card-bg);
            appearance: none;
            -webkit-appearance: none;
            cursor: pointer;
            transition: border-color 0.2s, box-shadow 0.2s;
            box-shadow: var(--shadow);
            font-family: var(--font);
        }

        .city-selector select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
        }

        /* ============================================================
           检索方式切换
           ============================================================ */
        .method-toggle {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            padding: 5px;
            background: #fff1e6;
            border: 1px solid var(--border);
            border-radius: 14px;
        }

        .method-option {
            padding: 9px 8px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: var(--text-secondary);
            font-size: 12.5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: var(--font);
            white-space: nowrap;
        }

        .method-option.active {
            background: var(--card-bg);
            color: var(--primary-dark);
            box-shadow: 0 2px 8px rgba(120, 60, 20, 0.14);
        }

        .method-option:not(.active):hover {
            color: var(--primary);
        }

        .method-toggle.dimmed {
            opacity: 0.55;
        }

        .compare-banner {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 6px;
            padding: 9px 12px;
            border-radius: 12px;
            background: linear-gradient(135deg, #e0f2fe 0%, #bae6fd 100%);
            border: 1px solid #7dd3fc;
            color: #0369a1;
            font-size: 12.5px;
            font-weight: 700;
            box-shadow: var(--shadow);
        }

        .compare-banner.visible {
            display: flex;
            animation: fadeIn 0.25s ease-out;
        }

        /* ============================================================
           检索方式对比面板
           ============================================================ */
        .compare-card {
            display: none;
            background: linear-gradient(180deg, #ffffff 0%, #f0f9ff 100%);
            border-radius: var(--radius);
            padding: 18px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .compare-card.visible {
            display: block;
            animation: slideUp 0.32s ease-out;
        }

        .compare-head {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 14px;
            font-weight: 800;
            font-size: 15px;
            color: #0369a1;
        }

        .compare-city {
            font-size: 11px;
            font-weight: 600;
            padding: 2px 8px;
            background: var(--accent-light);
            color: #0369a1;
            border-radius: 999px;
        }

        .compare-summary {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 10px;
        }

        .cs-item {
            font-size: 12px;
            color: var(--text-secondary);
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 999px;
            padding: 4px 10px;
        }

        .cs-item b {
            color: var(--primary-dark);
        }

        .compare-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: 14px;
        }

        .cc-chip {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 999px;
            color: white;
        }

        .cc-chip.cc-bad {
            background: #fca5a5;
        }

        .cc-keyword { background: #64748b; }
        .cc-bm25 { background: #2563eb; }
        .cc-vector { background: #ea580c; }
        .cc-hybrid { background: #16a34a; }

        .cm-table {
            display: grid;
            grid-template-columns: minmax(0, 2.1fr) repeat(4, minmax(0, 1fr));
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow: hidden;
        }

        .cm-row {
            display: contents;
        }

        .cm-head .cm-source,
        .cm-head .cm-col {
            background: #f1f5f9;
            color: var(--text-secondary);
            font-size: 11px;
            font-weight: 700;
            padding: 8px 4px;
            border-top: none;
        }

        .cm-head .cm-source {
            text-align: left;
            padding-left: 10px;
        }

        .cm-source,
        .cm-col {
            padding: 8px 6px;
            border-top: 1px solid var(--border);
            min-width: 0;
        }

        .cm-source {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 11.5px;
            color: var(--text);
        }

        .cm-src-rank {
            flex: none;
            width: 15px;
            height: 15px;
            border-radius: 5px;
            background: #e2e8f0;
            color: #475569;
            font-size: 10px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .cm-title {
            flex: 1;
            min-width: 0;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .cm-city {
            flex: none;
            font-size: 9.5px;
            color: var(--primary-dark);
            background: var(--primary-light);
            border-radius: 999px;
            padding: 1px 5px;
        }

        .cm-col {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .cm-rank {
            min-width: 18px;
            height: 18px;
            border-radius: 6px;
            font-size: 10.5px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .r-keyword { background: #64748b; }
        .r-bm25 { background: #2563eb; }
        .r-vector { background: #ea580c; }
        .r-hybrid { background: #16a34a; }

        .cm-miss {
            color: #cbd5e1;
            font-size: 12px;
        }

        .cm-shared .cm-source {
            background: #fff7ed;
        }

        .cm-shared .cm-col {
            background: #fffbeb;
        }

        .cm-empty {
            padding: 16px;
            text-align: center;
            color: var(--text-secondary);
            font-size: 12px;
        }

        .compare-legend {
            margin-top: 10px;
            font-size: 10.5px;
            color: var(--text-secondary);
            line-height: 1.6;
        }

        .lg-shared {
            color: var(--primary-deep);
            font-weight: 700;
        }

        .city-selector::after {
            content: '▾';
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: var(--text-secondary);
            font-size: 14px;
        }

        /* ============================================================
           输入区域
           ============================================================ */
        .input-area {
            display: flex;
            gap: 8px;
        }

        .input-wrapper {
            flex: 1;
            position: relative;
        }

        .input-wrapper input {
            width: 100%;
            padding: 13px 15px;
            border: 1.5px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 15px;
            color: var(--text);
            background: var(--card-bg);
            transition: border-color 0.2s, box-shadow 0.2s;
            box-shadow: var(--shadow);
            font-family: var(--font);
        }

        .input-wrapper input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light), var(--shadow);
        }

        .input-wrapper input::placeholder {
            color: #b9a99b;
        }

        .btn {
            padding: 13px 20px;
            border: none;
            border-radius: 14px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.22s ease;
            font-family: var(--font);
            white-space: nowrap;
        }

        .btn-primary {
            background: linear-gradient(135deg, #fb923c 0%, #f97316 55%, #ea580c 100%);
            color: white;
            box-shadow: 0 6px 16px rgba(234, 88, 12, 0.28);
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 22px rgba(234, 88, 12, 0.34);
            filter: brightness(1.04);
        }

        .btn-primary:active:not(:disabled) {
            transform: translateY(0) scale(0.98);
        }

        .btn-primary:disabled {
            background: #e7e5e4;
            color: #a8a29e;
            box-shadow: none;
            cursor: not-allowed;
        }

        .btn-outline {
            background: var(--card-bg);
            color: var(--text-secondary);
            border: 1.5px solid var(--border);
        }

        .btn-outline:hover {
            background: #faf5ef;
            border-color: #eadfd2;
            color: var(--text);
        }

        .btn-row {
            display: flex;
            gap: 8px;
        }

        /* ============================================================
           快捷标签
           ============================================================ */
        .quick-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .quick-tag {
            padding: 8px 15px;
            background: var(--card-bg);
            border: 1.5px solid var(--border);
            border-radius: 999px;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s;
            user-select: none;
            white-space: nowrap;
            box-shadow: var(--shadow);
        }

        .quick-tag:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: linear-gradient(135deg, #fff7ed 0%, #ffedd5 100%);
            transform: translateY(-1px);
            box-shadow: 0 6px 14px rgba(234, 88, 12, 0.14);
        }

        .quick-tag:active {
            transform: scale(0.95);
        }

        /* ============================================================
           加载状态
           ============================================================ */
        .loading-indicator {
            display: none;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px;
            background: rgba(255, 255, 255, 0.85);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            color: var(--text-secondary);
            font-size: 14px;
            box-shadow: var(--shadow);
        }

        .loading-indicator.active {
            display: flex;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 3px solid var(--primary-light);
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ============================================================
           答案区域
           ============================================================ */
        .answer-card {
            display: none;
            background: linear-gradient(180deg, #ffffff 0%, #fffdfa 100%);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .answer-card.visible {
            display: block;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .answer-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 14px;
            font-weight: 800;
            font-size: 16px;
            color: var(--primary-dark);
        }

        .answer-header .icon {
            font-size: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 34px;
            height: 34px;
            background: var(--primary-light);
            border-radius: 11px;
        }

        .answer-body {
            font-size: 14.5px;
            line-height: 1.85;
            color: var(--text);
            white-space: pre-wrap;
            word-break: break-word;
        }

        .answer-body h1, .answer-body h2 { font-size: 16px; margin: 12px 0 6px; color: var(--primary-dark); }
        .answer-body h3 { font-size: 15px; margin: 10px 0 4px; }
        .answer-body ul, .answer-body ol { padding-left: 20px; margin: 8px 0; }
        .answer-body li { margin: 4px 0; }

        .answer-footer {
            margin-top: 18px;
            padding-top: 14px;
            border-top: 1px dashed var(--border);
        }

        .answer-footer .meta {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 10px;
            line-height: 1.9;
        }

        .sources-title {
            font-size: 13px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
        }

        .source-item {
            display: inline-block;
            padding: 5px 11px;
            margin: 3px 6px 3px 0;
            background: #fff7ed;
            border: 1px solid #fed7aa;
            border-radius: 999px;
            font-size: 12px;
            color: #c2410c;
        }

        .source-item .city-badge {
            display: inline-block;
            padding: 1px 7px;
            background: var(--primary-light);
            border-radius: 999px;
            margin-left: 5px;
            font-size: 11px;
            color: var(--primary-dark);
        }

        /* ============================================================
           错误/提示信息
           ============================================================ */
        .message-box {
            display: none;
            padding: 14px 16px;
            border-radius: 14px;
            font-size: 14px;
            text-align: center;
            line-height: 1.7;
        }

        .message-box.visible {
            display: block;
            animation: fadeIn 0.25s ease-out;
        }

        .message-box.error {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        .message-box.info {
            background: #fff7ed;
            color: #c2410c;
            border: 1px solid #fed7aa;
        }

        .message-box.warning {
            background: #fffbeb;
            color: #92400e;
            border: 1px solid #fde68a;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .retry-btn {
            display: inline-block;
            margin-top: 8px;
            padding: 7px 18px;
            background: white;
            border: 1px solid currentColor;
            border-radius: 999px;
            color: inherit;
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            font-family: var(--font);
            transition: all 0.2s;
        }

        .retry-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(120, 60, 20, 0.12);
        }

        /* ============================================================
           已覆盖城市面板
           ============================================================ */
        .city-panel {
            background: linear-gradient(180deg, #ffffff 0%, #fffaf5 100%);
            border-radius: var(--radius);
            padding: 18px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .city-panel h3 {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 12px;
            font-weight: 700;
        }

        .city-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .city-card {
            padding: 12px 8px;
            background: #fff8f0;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.22s;
            border: 1.5px solid transparent;
            text-align: center;
        }

        .city-card:hover {
            border-color: #fdba74;
            background: #fff1e6;
            transform: translateY(-3px);
            box-shadow: 0 8px 18px rgba(234, 88, 12, 0.12);
        }

        .city-card:active { transform: scale(0.96); }

        .city-card .city-emoji {
            font-size: 26px;
            display: block;
            margin-bottom: 4px;
            transition: transform 0.2s;
        }

        .city-card:hover .city-emoji { transform: scale(1.18) rotate(-6deg); }
        .city-card .city-name { font-size: 13px; font-weight: 700; color: var(--text); }
        .city-card .city-tag { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }

        /* ============================================================
           问答历史面板
           ============================================================ */
        .history-panel {
            display: none;
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 18px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .history-panel.visible { display: block; }

        .history-panel h3 {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 10px;
            font-weight: 700;
        }

        .history-item {
            padding: 10px 0;
            border-bottom: 1px solid #faf3ea;
            cursor: pointer;
            transition: background 0.15s;
        }

        .history-item:hover { background: #fdf6ee; }

        .history-item .h-q {
            font-size: 13.5px;
            color: var(--text);
            font-weight: 600;
        }

        .history-item .h-meta {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 3px;
        }

        /* ============================================================
           底部
           ============================================================ */
        .footer {
            padding: 14px 16px 18px;
            text-align: center;
            font-size: 11.5px;
            color: var(--text-secondary);
            border-top: 1px solid var(--border);
            background: linear-gradient(180deg, transparent 0%, rgba(255, 237, 213, 0.35) 100%);
        }

        .footer a { color: var(--primary); text-decoration: none; font-weight: 600; }

        /* ============================================================
           响应式：大屏居中
           ============================================================ */
        @media (min-width: 415px) {
            body {
                padding: 24px 20px;
                align-items: flex-start;
            }
            .app-container {
                min-height: auto;
                border-radius: 24px;
                overflow: hidden;
                margin-top: 8px;
                border: 1px solid rgba(255, 255, 255, 0.65);
            }
        }

        /* 高屏设备 */
        @media (min-height: 800px) and (min-width: 415px) {
            body { align-items: center; }
        }

        /* ============================================================
           全局细节：滚动条、选中、键盘焦点
           ============================================================ */
        html { scroll-behavior: smooth; }

        ::selection { background: #fed7aa; color: #7c2d12; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #e7d5c3; border-radius: 8px; }
        ::-webkit-scrollbar-thumb:hover { background: #d9bfa7; }

        button:focus-visible,
        select:focus-visible,
        input:focus-visible {
            outline: 2px solid var(--primary);
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- ========== 顶部标题栏 ========== -->
        <div class="header">
            <span class="header-icon">🏔️</span>
            <h1>走遍中国 · 智能旅游助手</h1>
            <p class="subtitle">你的全国旅行规划顾问</p>
        </div>

        <!-- ========== 主内容区 ========== -->
        <div class="main-content">
            <!-- 城市选择 -->
            <div class="city-selector">
                <select id="city-select" aria-label="选择城市">
                    <option value="">🌍 全部城市（不限）</option>
                    <!-- 城市选项由 JS 从 /api/cities 动态加载 -->
                </select>
            </div>

            <!-- 检索方式切换 -->
            <div class="method-toggle" id="method-toggle" role="group" aria-label="选择检索方式">
                <button type="button" class="method-option active" data-method="bm25">BM25</button>
                <button type="button" class="method-option" data-method="keyword">关键词</button>
                <button type="button" class="method-option" data-method="vector">向量</button>
                <button type="button" class="method-option" data-method="hybrid">混合</button>
            </div>

            <!-- 对比模式提示 -->
            <div class="compare-banner" id="compare-banner">⚖️ 对比模式 · 四种检索方式对比</div>

            <!-- 搜索输入 -->
            <div class="input-area">
                <div class="input-wrapper">
                    <input
                        type="text"
                        id="question-input"
                        placeholder="🔍 输入你的旅游问题..."
                        autocomplete="off"
                        maxlength="500"
                    >
                </div>
            </div>

            <div class="btn-row">
                <button class="btn btn-primary" id="ask-btn" style="flex:1">💬 提问</button>
                <button class="btn btn-outline" id="clear-btn">🗑️ 清空</button>
            </div>

            <!-- 快捷标签 -->
            <div class="quick-tags" id="quick-tags">
                    <!-- 快捷标签由 JS 从知识库随机采样动态生成 -->
                </div>

            <!-- 加载中 -->
            <div class="loading-indicator" id="loading">
                <div class="spinner"></div>
                <span>正在为你搜索和整理答案...</span>
            </div>

            <!-- 错误/提示信息 -->
            <div class="message-box" id="message-box"></div>

            <!-- 答案展示 -->
            <div class="answer-card" id="answer-card">
                <div class="answer-header">
                    <span class="icon">📝</span> 回答
                </div>
                <div class="answer-body" id="answer-body"></div>
                <div class="answer-footer" id="answer-footer"></div>
            </div>

            <!-- 检索方式对比 -->
            <div class="compare-card" id="compare-card"></div>

            <!-- 城市覆盖面板 -->
            <div class="city-panel">
                <h3>💡 已覆盖城市（点击快速体验）</h3>
                <div class="city-grid" id="city-grid">
                    <!-- 城市卡片由 JS 从 /api/cities 动态加载 -->
                </div>
            </div>

            <!-- 问答历史面板 -->
            <div class="history-panel" id="history-panel">
                <h3>📋 最近问答</h3>
                <div id="history-list"></div>
            </div>
        </div>

        <!-- ========== 底部 ========== -->
        <div class="footer">
            走遍中国 · 智能旅游助手 v1.0 | 知识覆盖 8 个热门旅游城市
        </div>
    </div>

    <script>
    /* ============================================================
       JavaScript — 问答交互逻辑
       ============================================================ */

    // API 地址自动适配：手机访问时用同源地址，本地文件打开时用 localhost
const API_BASE = window.location.origin.startsWith('http')
    ? window.location.origin
    : 'http://localhost:8000';

    // DOM 元素
    const citySelect = document.getElementById('city-select');
    const methodToggle = document.getElementById('method-toggle');
    const compareBanner = document.getElementById('compare-banner');
    const questionInput = document.getElementById('question-input');
    const askBtn = document.getElementById('ask-btn');
    const clearBtn = document.getElementById('clear-btn');
    const loadingEl = document.getElementById('loading');
    const messageBox = document.getElementById('message-box');
    const answerCard = document.getElementById('answer-card');
    const answerBody = document.getElementById('answer-body');
    const answerFooter = document.getElementById('answer-footer');
    const compareCard = document.getElementById('compare-card');
    const historyPanel = document.getElementById('history-panel');
    const historyList = document.getElementById('history-list');

    // 状态
    let abortController = null;
    let currentMethod = 'bm25';
    let compareMode = location.pathname.includes('/compare');
    const HISTORY_KEY = 'travel_qa_history';
    const MAX_HISTORY = 20;

    // 对比模式：仅通过 /compare 地址进入
    if (compareMode) {
        compareBanner.classList.add('visible');
        methodToggle.classList.add('dimmed');
    }

    // ========== 初始化 ==========
    async function init() {
        await loadCities();       // 先从后端加载城市列表
        loadHistory();
        bindEvents();
        checkHealth();
    }

    // ========== 从后端动态加载城市信息 ==========
    window._cityList = [];        // 全局城市名缓存，供 extractCityFromQuestion 使用
    const CITY_EMOJI_MAP = {      // 城市名 → emoji 映射
        '北京': '🏯', '杭州': '🌸', '成都': '🐼', '西安': '⚔️',
        '重庆': '🌆', '广州': '🥟', '苏州': '🏡', '长沙': '🌶️',
    };

    async function loadCities() {
        try {
            const res = await fetch(`${API_BASE}/api/cities`);
            if (!res.ok) throw new Error('Failed');
            const cities = await res.json();

            // 缓存城市名列表
            window._cityList = cities.map(c => c.city);

            // 1. 填充城市下拉框
            const select = document.getElementById('city-select');
            cities.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.city;
                const emoji = CITY_EMOJI_MAP[c.city] || '📍';
                opt.textContent = `${emoji} ${c.city} — ${c.tags}`;
                select.appendChild(opt);
            });

            // 2. 渲染城市卡片
            const grid = document.getElementById('city-grid');
            grid.innerHTML = '';
            cities.forEach(c => {
                const card = document.createElement('div');
                card.className = 'city-card';
                card.dataset.city = c.city;
                const emoji = CITY_EMOJI_MAP[c.city] || '📍';
                const shortTag = c.tags.split('、').slice(0, 2).join('·');
                card.innerHTML = `<span class="city-emoji">${emoji}</span>
                    <span class="city-name">${c.city}</span>
                    <span class="city-tag">${shortTag}</span>`;
                grid.appendChild(card);
            });

            // 3. 动态生成快捷标签（从各城市采样热门关键词）
            const tagsContainer = document.getElementById('quick-tags');
            tagsContainer.innerHTML = '';
            const sampleQueries = [
                { q: '北京故宫门票多少钱？', label: '北京故宫' },
                { q: '成都火锅有什么推荐？', label: '成都火锅' },
                { q: '西安兵马俑怎么去？', label: '西安兵马俑' },
                { q: '长沙橘子洲怎么玩？', label: '长沙橘子洲' },
                { q: '广州早茶推荐什么？', label: '广州早茶' },
                { q: '苏州园林一天能逛几个？', label: '苏州园林' },
                { q: '重庆三天两晚怎么安排？', label: '重庆三日游' },
                { q: '杭州西湖有哪些景点？', label: '杭州西湖' },
            ];
            // 只展示已覆盖城市的快捷标签
            const coveredNames = new Set(cities.map(c => c.city));
            sampleQueries.forEach(item => {
                const cityName = item.q.match(/[一-龥]{2,3}/)?.[0] || '';
                if (coveredNames.has(cityName) || item.q.includes('三天') || item.q.includes('早茶')) {
                    const tag = document.createElement('span');
                    tag.className = 'quick-tag';
                    tag.dataset.q = item.q;
                    tag.textContent = item.label;
                    tagsContainer.appendChild(tag);
                }
            });

            console.log(`✅ ${cities.length} 个城市已加载：${window._cityList.join('、')}`);
        } catch (e) {
            console.warn('⚠️ 无法加载城市列表，使用默认值', e);
        }
    }

    // ========== 事件绑定 ==========
    function bindEvents() {
        // 提问按钮
        askBtn.addEventListener('click', () => askQuestion());

        // 检索方式切换
        methodToggle.addEventListener('click', (e) => {
            const btn = e.target.closest('.method-option');
            if (!btn) return;
            currentMethod = btn.dataset.method;
            methodToggle.querySelectorAll('.method-option').forEach(b => b.classList.toggle('active', b === btn));
        });

        // 回车键提问
        questionInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                askQuestion();
            }
        });

        // 清空按钮
        clearBtn.addEventListener('click', clearAll);

        // 城市卡片点击
        document.getElementById('city-grid').addEventListener('click', (e) => {
            const card = e.target.closest('.city-card');
            if (!card) return;
            const city = card.dataset.city;
            citySelect.value = city;
            questionInput.value = `${city}有什么好玩的地方？`;
            questionInput.focus();
        });

        // 快捷标签点击
        document.getElementById('quick-tags').addEventListener('click', (e) => {
            const tag = e.target.closest('.quick-tag');
            if (!tag) return;
            const q = tag.dataset.q;
            questionInput.value = q;
            // 尝试从问题中提取城市
            const city = extractCityFromQuestion(q);
            if (city) citySelect.value = city;
            askQuestion();
        });
    }

    // ========== 辅助函数 ==========
    function extractCityFromQuestion(q) {
        // 从问题中提取城市名（城市列表从缓存读取）
        const cities = window._cityList || [];
        for (const city of cities) {
            if (q.includes(city)) return city;
        }
        return '';
    }

    function showLoading(show) {
        loadingEl.classList.toggle('active', show);
    }

    function hideMessage() {
        messageBox.classList.remove('visible', 'error', 'info', 'warning');
        messageBox.innerHTML = '';
    }

    function showMessage(text, type = 'info') {
        messageBox.className = 'message-box visible ' + type;
        messageBox.innerHTML = text;
    }

    function showError(text, retryable = false) {
        let html = text;
        if (retryable) {
            html += '<br><button class="retry-btn" onclick="askQuestion()">🔄 重试</button>';
        }
        showMessage(html, 'error');
    }

    function hideAnswer() {
        answerCard.classList.remove('visible');
    }

    function hideCompare() {
        compareCard.classList.remove('visible');
    }

    function showCompare(data) {
        const METHODS = [
            { method: 'keyword', label: '关键词' },
            { method: 'bm25', label: 'BM25' },
            { method: 'vector', label: '向量' },
            { method: 'hybrid', label: '混合' },
        ];

        // 按来源 id 聚合四种方式的召回
        const byId = new Map();
        data.methods.forEach(m => {
            if (m.status !== 'ok') return;
            m.results.forEach((r, idx) => {
                const id = r.id || r.title || '';
                if (!byId.has(id)) {
                    byId.set(id, { id: id, title: r.title || '', city: r.city || '', foundBy: [] });
                }
                byId.get(id).foundBy.push({ method: m.method, rank: idx + 1 });
            });
        });
        const sources = Array.from(byId.values());
        sources.forEach(s => {
            s.bestRank = Math.min(...s.foundBy.map(f => f.rank));
            s.foundCount = s.foundBy.length;
        });
        // 被越多方式召回越靠前，其次看最佳名次
        sources.sort((a, b) => (b.foundCount - a.foundCount) || (a.bestRank - b.bestRank));

        // 摘要：Top1 一致性
        const okMethods = data.methods.filter(m => m.status === 'ok' && m.results.length > 0);
        const top1Counts = {};
        okMethods.forEach(m => {
            const id = m.results[0].id || m.results[0].title || '';
            top1Counts[id] = (top1Counts[id] || 0) + 1;
        });
        const top1Best = Math.max(0, ...Object.values(top1Counts));

        let html = '<div class="compare-head">⚖️ 检索方式对比';
        if (data.detected_city) {
            html += ` <span class="compare-city">${data.detected_city}</span>`;
        }
        html += '</div>';

        html += '<div class="compare-summary">';
        html += `<span class="cs-item">召回来源 <b>${sources.length}</b> 条</span>`;
        if (okMethods.length > 0) {
            html += `<span class="cs-item">Top1 一致 <b>${top1Best}/${okMethods.length}</b></span>`;
        }
        html += '</div>';

        html += '<div class="compare-chips">';
        data.methods.forEach(m => {
            const text = m.status === 'ok'
                ? `${m.label} ${m.latency_ms}ms`
                : `${m.label} ${m.status === 'unavailable' ? '不可用' : '出错'}`;
            html += `<span class="cc-chip ${m.status === 'ok' ? 'cc-' + m.method : 'cc-bad'}">${text}</span>`;
        });
        html += '</div>';

        html += '<div class="cm-table">';
        html += '<div class="cm-row cm-head"><div class="cm-source">来源</div>';
        METHODS.forEach(m => { html += `<div class="cm-col">${m.label}</div>`; });
        html += '</div>';

        if (sources.length === 0) {
            html += '<div class="cm-empty">无召回结果</div>';
        } else {
            sources.forEach((s, idx) => {
                html += `<div class="cm-row${s.foundCount > 1 ? ' cm-shared' : ''}">`;
                html += `<div class="cm-source"><span class="cm-src-rank">${idx + 1}</span><span class="cm-title" title="${s.title}">${s.title}</span><span class="cm-city">${s.city}</span></div>`;
                METHODS.forEach(m => {
                    const f = s.foundBy.find(x => x.method === m.method);
                    if (!f) {
                        html += '<div class="cm-col"><span class="cm-miss">—</span></div>';
                    } else {
                        html += `<div class="cm-col"><span class="cm-rank r-${m.method}">${f.rank}</span></div>`;
                    }
                });
                html += '</div>';
            });
        }
        html += '</div>';

        html += '<div class="compare-legend">数字＝该方式中的名次 · —＝未召回 · <span class="lg-shared">高亮行</span>＝多种方式共同召回</div>';

        compareCard.innerHTML = html;
        compareCard.classList.add('visible');
        compareCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function showAnswer(data) {
        // 答案正文
        answerBody.textContent = data.answer;

        // 来源信息
        let footerHTML = '';
        if (data.detected_city) {
            footerHTML += `<div class="meta">📍 识别城市：<strong>${data.detected_city}</strong> &nbsp;|&nbsp; 🔍 检索方式：${data.retrieval_method} &nbsp;|&nbsp; 🤖 模型：${data.model}</div>`;
        } else {
            footerHTML += `<div class="meta">🔍 检索方式：${data.retrieval_method} &nbsp;|&nbsp; 🤖 模型：${data.model}</div>`;
        }

        if (data.sources && data.sources.length > 0) {
            footerHTML += '<div class="sources-title">📎 参考来源：</div>';
            data.sources.forEach((src, idx) => {
                footerHTML += `<span class="source-item">[${idx + 1}] ${src.title} <span class="city-badge">${src.city || ''}</span></span>`;
            });
        }

        answerFooter.innerHTML = footerHTML;
        answerCard.classList.add('visible');
        answerCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // ========== 对比模式：分别请求四种检索方式 ==========
    async function runCompare(question, city) {
        const methods = [
            { method: 'keyword', label: '关键词匹配' },
            { method: 'bm25', label: 'BM25' },
            { method: 'vector', label: '向量相似度' },
            { method: 'hybrid', label: 'BM25+向量' },
        ];

        let vectorStatus = 'not_loaded';
        try {
            const h = await fetch(`${API_BASE}/api/health`);
            if (h.ok) {
                vectorStatus = (await h.json()).vector_retrieval || 'not_loaded';
            }
        } catch (e) { /* 忽略 */ }

        const out = [];
        let detectedCity = city || null;
        for (const m of methods) {
            const t0 = performance.now();
            let status = 'ok';
            let results = [];
            try {
                const res = await fetch(`${API_BASE}/api/ask`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question: question,
                        city: city,
                        top_k: 3,
                        method: m.method,
                        raw: true,
                    }),
                    signal: abortController.signal,
                });
                if (!res.ok) throw new Error('http ' + res.status);
                const data = await res.json();
                if (!detectedCity && data.detected_city) {
                    detectedCity = data.detected_city;
                }
                results = data.sources || [];
            } catch (e) {
                if (e.name === 'AbortError') throw e;
                status = 'error';
            }
            if ((m.method === 'vector' || m.method === 'hybrid') && vectorStatus === 'unavailable') {
                status = 'unavailable';
                results = [];
            }
            out.push({
                method: m.method,
                label: m.label,
                status: status,
                latency_ms: Math.round(performance.now() - t0),
                results: results,
            });
        }
        return { question: question, detected_city: detectedCity, methods: out };
    }

    // ========== 核心：提问 ==========
    async function askQuestion() {
        const question = questionInput.value.trim();

        // 空问题检查
        if (!question) {
            showMessage('请输入您的问题', 'warning');
            questionInput.focus();
            return;
        }

        // 敏感词简单过滤
        const sensitivePatterns = /[黄赌毒]|赌博|色情|违法/;
        if (sensitivePatterns.test(question)) {
            showMessage('请提出与旅游相关的问题', 'warning');
            return;
        }

        // UI 状态
        hideMessage();
        hideAnswer();
        hideCompare();
        loadingEl.querySelector('span').textContent = compareMode
            ? '正在对比四种检索方式...'
            : '正在为你搜索和整理答案...';
        showLoading(true);
        askBtn.disabled = true;

        // 取消之前的请求
        if (abortController) {
            abortController.abort();
        }
        abortController = new AbortController();

        const city = citySelect.value || null;

        try {
            let data;
            if (compareMode) {
                data = await runCompare(question, city);
            } else {
                const res = await fetch(`${API_BASE}/api/ask`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        question: question,
                        city: city,
                        top_k: 5,
                        method: currentMethod
                    }),
                    signal: abortController.signal,
                });

                if (!res.ok) {
                    if (res.status === 400) {
                        const errData = await res.json();
                        throw new Error(errData.detail || '输入有误');
                    } else if (res.status === 422) {
                        const errData = await res.json();
                        const msg = errData.detail?.[0]?.msg || '输入格式有误';
                        throw new Error(msg);
                    } else if (res.status >= 500) {
                        throw new Error('服务器内部错误，请稍后重试');
                    }
                    throw new Error(`请求失败 (${res.status})`);
                }
                data = await res.json();
            }

            if (compareMode) {
                showCompare(data);
            } else {
                showAnswer(data);
                saveToHistory(question, data);
                // 显示历史面板
                if (getHistory().length > 0) {
                    renderHistory();
                    historyPanel.classList.add('visible');
                }
            }

        } catch (err) {
            if (err.name === 'AbortError') {
                // 用户取消，不报错
                return;
            }
            if (err.message.includes('Failed to fetch') || err.message.includes('NetworkError')) {
                showError('请求失败，请确认后端已启动（localhost:8000）<br>启动命令：<code>cd backend && uvicorn main:app --host 0.0.0.0 --port 8000</code>', true);
            } else if (err.message.includes('timeout') || err.message.includes('Timeout')) {
                showError('服务器响应超时，请重试', true);
            } else {
                showError(err.message, true);
            }
        } finally {
            showLoading(false);
            askBtn.disabled = false;
            abortController = null;
        }
    }

    // ========== 清空 ==========
    function clearAll() {
        questionInput.value = '';
        citySelect.value = '';
        hideAnswer();
        hideCompare();
        hideMessage();
    }

    // ========== 后端健康检查 ==========
    async function checkHealth() {
        try {
            const res = await fetch(`${API_BASE}/api/health`, { signal: AbortSignal.timeout(3000) });
            if (res.ok) {
                const data = await res.json();
                console.log('✅ 后端连接成功', data);
            }
        } catch (e) {
            console.warn('⚠️ 后端未启动，请执行: cd backend && uvicorn main:app --host 0.0.0.0 --port 8000');
            showMessage(
                '⚠️ 后端服务未启动<br><small>请在终端执行：<code>cd backend && uvicorn main:app --host 0.0.0.0 --port 8000</code></small>',
                'warning'
            );
        }
    }

    // ========== 问答历史 (localStorage) ==========
    function getHistory() {
        try {
            const raw = localStorage.getItem(HISTORY_KEY);
            return raw ? JSON.parse(raw) : [];
        } catch (e) {
            return [];
        }
    }

    function saveToHistory(question, data) {
        const history = getHistory();
        history.unshift({
            question: question,
            answer: data.answer ? data.answer.substring(0, 100) + '...' : '',
            detected_city: data.detected_city,
            timestamp: new Date().toISOString(),
            fullData: data,
        });
        // 限制数量
        if (history.length > MAX_HISTORY) {
            history.length = MAX_HISTORY;
        }
        try {
            localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        } catch (e) {
            // localStorage 满，清除旧记录
            history.length = 10;
            localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        }
    }

    function renderHistory() {
        const history = getHistory();
        if (history.length === 0) {
            historyList.innerHTML = '<p style="color:#94a3b8;font-size:13px;">暂无问答记录</p>';
            return;
        }
        historyList.innerHTML = history.slice(0, 10).map((item, idx) => `
            <div class="history-item" data-idx="${idx}">
                <div class="h-q">${escapeHtml(item.question)}</div>
                <div class="h-meta">${item.detected_city ? '📍' + item.detected_city + ' · ' : ''}${formatTime(item.timestamp)}</div>
            </div>
        `).join('');

        // 点击历史记录恢复
        historyList.querySelectorAll('.history-item').forEach(el => {
            el.addEventListener('click', () => {
                const idx = parseInt(el.dataset.idx);
                const history = getHistory();
                const item = history[idx];
                if (item && item.fullData) {
                    questionInput.value = item.question;
                    if (item.fullData.detected_city) {
                        citySelect.value = item.fullData.detected_city;
                    }
                    showAnswer(item.fullData);
                }
            });
        });
    }

    function loadHistory() {
        const history = getHistory();
        if (history.length > 0) {
            historyPanel.classList.add('visible');
            renderHistory();
        }
    }

    function formatTime(isoStr) {
        try {
            const d = new Date(isoStr);
            const now = new Date();
            const diff = now - d;
            if (diff < 60000) return '刚刚';
            if (diff < 3600000) return Math.floor(diff / 60000) + '分钟前';
            if (diff < 86400000) return Math.floor(diff / 3600000) + '小时前';
            return d.toLocaleDateString('zh-CN');
        } catch (e) {
            return '';
        }
    }

    function escapeHtml(str) {
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // ========== 启动 ==========
    init();
    console.log('🏔️ 走遍中国 · 智能旅游助手 已就绪');
    console.log('💡 快捷操作：点击城市卡片、快捷标签，或直接输入问题后按回车');
    </script>
</body>
