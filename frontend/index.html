<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#070b14">
    <meta name="description" content="走遍中国 · 智能旅游助手 — 覆盖 8 个热门旅游城市，景点 / 美食 / 交通 / 行程一站式问答">
    <title>走遍中国 · 智能旅游助手</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700;900&family=Outfit:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <!-- 背景装饰 -->
    <div class="bg" aria-hidden="true">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="grain"></div>
    </div>

    <div class="app-shell">
        <!-- ========== 顶栏 ========== -->
        <header class="topbar">
            <div class="brand">
                <div class="brand-mark">
                    <svg viewBox="0 0 24 24" fill="none" stroke="#241505" stroke-width="2.1" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M3 19.5h18" />
                        <path d="M5.2 19.5 10 11.5l3.2 4.1 2.1-2.9 3.5 6.8" />
                        <circle cx="16.8" cy="6.2" r="2.3" fill="#241505" stroke="none" />
                    </svg>
                </div>
                <div class="brand-text">
                    <h1>走遍中国</h1>
                    <p>智能旅游助手</p>
                </div>
            </div>
            <div class="topbar-actions">
                <div class="status-pill" id="status-pill" title="后端连接状态">
                    <span class="dot"></span>
                    <span id="status-label">连接中</span>
                </div>
                <button type="button" class="icon-btn" id="history-btn" aria-label="问答历史" title="最近问答">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="12" cy="12" r="9" />
                        <path d="M12 7v5l3 2" />
                    </svg>
                </button>
                <button type="button" class="icon-btn" id="clear-btn" aria-label="清空对话" title="清空对话">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M3 6h18" />
                        <path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2" />
                        <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6" />
                        <path d="M10 11v6M14 11v6" />
                    </svg>
                </button>
            </div>
        </header>

        <!-- ========== 聊天滚动区 ========== -->
        <main class="chat-scroll" id="chat-scroll">
            <!-- 欢迎页 -->
            <section class="welcome" id="welcome">
                <div class="welcome-mark">🏔️</div>
                <h2 class="welcome-title">下一站，去哪？</h2>
                <p class="welcome-sub">覆盖 8 个热门旅游城市<br>景点 · 美食 · 交通 · 行程 一站式问答</p>
                <div class="welcome-chips" id="welcome-chips"><!-- 由 JS 动态生成 --></div>
            </section>

            <!-- 对话流 -->
            <div id="conversation" class="conversation"></div>

            <!-- 打字指示器 -->
            <div class="typing" id="typing" hidden>
                <div class="typing-dots"><span></span><span></span><span></span></div>
                <span class="typing-text" id="typing-text">正在检索知识库…</span>
            </div>

            <!-- 检索方式对比矩阵 -->
            <div class="compare-card" id="compare-card" hidden></div>
        </main>

        <!-- ========== 底部操作区 ========== -->
        <footer class="composer">
            <!-- 城市快捷筛选 -->
            <div class="chip-scroll" id="city-chips"><!-- 城市 chips 由 JS 动态生成 --></div>

            <!-- 检索方式 -->
            <div class="method-toggle" id="method-toggle" role="group" aria-label="选择检索方式">
                <button type="button" class="method-option active" data-method="bm25">BM25</button>
                <button type="button" class="method-option" data-method="keyword">关键词</button>
                <button type="button" class="method-option" data-method="vector">向量</button>
                <button type="button" class="method-option" data-method="hybrid">混合</button>
            </div>
            <div class="compare-banner" id="compare-banner" hidden>⚖️ 对比模式 · 四种检索方式横向对比</div>

            <!-- 输入行 -->
            <div class="input-row">
                <div class="input-wrap">
                    <input type="text" id="question-input" placeholder="问点什么，比如：成都三天怎么玩？" autocomplete="off"
                        maxlength="500">
                </div>
                <button type="button" class="send-btn" id="ask-btn" aria-label="发送">
                    <svg viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M3.4 20.4l17.4-7.5c.8-.34.8-1.5 0-1.84L3.4 3.6c-.66-.3-1.4.27-1.4 1v4.9c0 .5.36.93.85 1L14 12 2.85 14.5c-.49.07-.85.5-.85 1v4.9c0 .73.74 1.3 1.4 1z" />
                    </svg>
                </button>
            </div>

            <!-- 快捷提问标签 -->
            <div class="chip-scroll" id="quick-tags"><!-- 快捷标签由 JS 动态生成 --></div>

            <!-- 知识贡献入口 -->
            <div class="contribute-box">
                <button type="button" class="contribute-toggle" id="contribute-toggle">+ 上传旅游经验</button>
                <div class="contribute-panel" id="contribute-panel" hidden>
                    <div class="contribute-grid">
                        <input type="text" id="contribute-city" placeholder="城市，如：成都" />
                        <input type="text" id="contribute-title" placeholder="标题，如：成都火锅路线" />
                    </div>
                    <textarea id="contribute-content" rows="4"
                        placeholder="请填写您的亲身经历或文案，说明景点、美食、交通、攻略等信息..."></textarea>
                    <div class="contribute-actions">
                        <label class="upload-label" for="contribute-file">
                            <input type="file" id="contribute-file" accept=".txt,.md,.json,.csv,.doc,.docx,.pdf" />
                            <span>上传文件</span>
                        </label>
                        <button type="button" class="primary-btn" id="submit-contribution">提交审核</button>
                    </div>
                    <div class="contribute-status" id="contribute-status"></div>
                </div>
            </div>
        </footer>

        <!-- ========== 历史抽屉 ========== -->
        <div class="sheet-backdrop" id="sheet-backdrop"></div>
        <section class="bottom-sheet" id="history-sheet" aria-label="最近问答">
            <div class="sheet-handle"></div>
            <div class="sheet-head">
                <h3>最近问答</h3>
                <button type="button" class="sheet-clear" id="history-clear">清空记录</button>
            </div>
            <div class="sheet-list" id="history-list"></div>
        </section>

        <!-- ========== Toast ========== -->
        <div class="toast" id="toast" hidden></div>
    </div>

    <script src="/static/app.js"></script>
</body>

</html>
