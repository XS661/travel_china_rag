[project]
name = "travel-china-rag"
version = "0.1.0"
description = "面向全国的智能旅游问答与推荐系统（RAG + FastAPI）"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "jieba>=0.42.1",
    "numpy>=1.26",
    "openai>=3.7.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=6.0.1",
    "uvicorn>=0.52.4",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
